<style>
  :root{
    --cream:#F3ECE4;
    --ink:#221F1D;
    --red:#A32020;
    --blue:#2C4EA3;
    --line:#C9BFB3;
  }
  *{box-sizing:border-box}
  body{margin:0}
  .wrap{
    min-height:100vh;
    background:var(--cream);
    display:flex;
    justify-content:center;
    padding:32px 18px 60px;
    font-family:'Courier New',monospace;
    color:var(--ink);
  }
  .card{width:100%;max-width:420px}
  .eyebrow{
    text-align:center;font-size:13px;letter-spacing:2px;
    color:var(--red);margin:0 0 4px;text-transform:uppercase;font-weight:700;
  }
  h1{
    text-align:center;font-family:Impact,'Arial Narrow',sans-serif;
    font-size:44px;letter-spacing:1px;margin:0 0 30px;line-height:0.95;
  }
  h1 span{color:var(--red)}
  .balloon{display:block;margin:0 auto 22px;width:150px;height:auto}
  .divider{display:flex;align-items:center;gap:10px;margin:22px 0;}
  .divider .ln{flex:1;height:1px;background:var(--ink)}
  .divider .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
  .divider .mark{color:var(--red);font-size:16px}
  .lead{text-align:center;font-size:15px;margin:0 0 6px}
  .banner{
    background:var(--red);color:#fff;text-align:center;
    padding:8px 14px;font-size:13px;letter-spacing:2px;
    font-weight:700;margin:10px auto 18px;width:fit-content;
  }
  .name{
    text-align:center;font-family:'Brush Script MT',cursive;
    font-size:36px;margin:0 0 20px;color:var(--ink);
  }
  .meta{margin:22px 0 6px}
  .meta-row{display:flex;align-items:center;gap:12px;font-size:15px;margin:10px 0}
  .meta-ico{color:var(--red);font-size:18px;width:20px;text-align:center}
  .greet{
    text-align:center;font-size:15px;margin:26px 0 18px;line-height:1.5;
  }
  .greet b{font-family:'Brush Script MT',cursive;font-size:26px;display:block;margin-bottom:6px}
  .cta{
    display:block;width:100%;text-align:center;text-decoration:none;
    padding:14px;background:var(--red);color:#fff;border:none;
    border-radius:4px;font-family:inherit;font-size:14px;letter-spacing:1px;
    text-transform:uppercase;font-weight:700;cursor:pointer;margin-top:10px;
  }
  .cta:active{opacity:0.85}
  .box{
    border:1px solid var(--ink);padding:16px 18px;margin-top:26px;
    font-size:14px;text-align:center;line-height:1.5;
  }
</style>

<div class="wrap">
  <div class="card">

    <div class="eyebrow">Invitación</div>
    <h1>CUMPLE<span>AÑOS</span></h1>

    <svg class="balloon" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="75" rx="52" ry="65" fill="#2C4EA3"/>
      <ellipse cx="42" cy="50" rx="16" ry="22" fill="#5678C8" opacity="0.55"/>
      <path d="M60 138 L54 148 L66 148 Z" fill="#2C4EA3"/>
      <path d="M60 148 C 55 165, 68 178, 58 198" stroke="#2C4EA3" fill="none" stroke-width="2"/>
    </svg>

    <div class="divider"><span class="ln"></span><span class="mark">✦</span><span class="ln"></span></div>

    <p class="lead">Estás invitado a celebrar el</p>
    <div class="banner">CUMPLEAÑOS DE</div>
    <p class="name">Rubén Escobedo Horna</p>

    <div class="meta">
      <div class="meta-row"><span class="meta-ico">📅</span> 12 de septiembre</div>
      <div class="meta-row"><span class="meta-ico">🕑</span> A partir de las 14:00 h</div>
    </div>

    <div class="greet" id="greet"></div>

    <a class="cta" id="ctaBtn" href="#" target="_blank" rel="noopener">Confirmar asistencia</a>

    <div class="box">¡Te esperamos para brindar, reír y pasarlo en grande!</div>
  </div>
</div>

<script>
  const FORM_BASE = 'https://docs.google.com/forms/d/e/1FAIpQLSdM4Lvt_VVoKPMsvCOHOM9qHH5UB_3s69RlYRXAJ-5PPeQXeg/viewform';
  const NAME_ENTRY = 'entry.79745499';

  const params = new URLSearchParams(window.location.search);
  const guestName = params.get('name') || '';

  const greetEl = document.getElementById('greet');
  const ctaBtn = document.getElementById('ctaBtn');

  if(guestName){
    greetEl.innerHTML = '<b>Bienvenido/a ' + guestName + '</b>Te esperamos el próximo 12 de septiembre';
  }

  const formUrl = new URL(FORM_BASE);
  formUrl.searchParams.set('usp', 'pp_url');
  if(guestName){
    formUrl.searchParams.set(NAME_ENTRY, guestName);
  }
  ctaBtn.href = formUrl.toString();
</script>
